[package]
name = "sqrul"
version = "1.0.0"
edition = "2021"
rust-version = "1.83"
authors = ["SQRUL Developers"]
description = "A modular, asynchronous SQL Injection Vulnerability Scanner for defensive security assessments."

[dependencies]
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "deflate", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
colored = "2.1"
html-escape = "0.2"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.0"
tempfile = "3.10"

