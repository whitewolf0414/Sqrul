name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Release Asset
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sqrul-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sqrul-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sqrul-macos-amd64

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build Binary
      run: cargo build --release --target ${{ matrix.target }} --bin sqrul-cli

    - name: Copy & Rename Binary
      shell: bash
      run: |
        mkdir dist
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp target/${{ matrix.target }}/release/sqrul-cli.exe dist/${{ matrix.artifact_name }}
        else
          cp target/${{ matrix.target }}/release/sqrul-cli dist/${{ matrix.artifact_name }}
        fi

    - name: Upload Binary to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
