name: Bug report
about: Create a report to help us improve SQRUL
title: '[BUG] '
labels: bug
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the details below to help us reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Set config to '...'
        3. See error '...'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Rust version (cargo --version), SQRUL version, etc.
      placeholder: e.g. Ubuntu 22.04, rustc 1.78.0, sqrul 0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Please copy and paste any terminal outputs, debug logs, or error traces here.
      render: shell
